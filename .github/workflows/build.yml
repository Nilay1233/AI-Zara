name: Build & Release Windows Electron App

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Build Electron Windows .exe (NSIS Installer & Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --config.publish=never

      - name: List built release files
        shell: bash
        run: |
          ls -la release/

      - name: Upload Windows Installer as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zara-AI-Companion-Windows-x64
          path: release/*.exe
          retention-days: 14

      - name: Attach .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
